<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>batu partners</title>
<meta name="description" content="batu partners · organic intelligence">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ground:#f3f1ec; --ink:#1f2a24; --muted:#6b756e; --line:#cfd4cc; --accent:#3d5a46; }
  @media (prefers-color-scheme: dark) { :root { --ground:#141814; --ink:#e7e9e3; --muted:#9aa39b; --line:#2c332d; --accent:#9cbfa5; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: Inter, system-ui, sans-serif;
         display: grid; place-items: center; padding: 24px; }
  main { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 300; font-size: clamp(44px, 9vw, 88px);
       letter-spacing: -0.02em; margin: 0; line-height: 1; }
  .tag { font-size: 13px; letter-spacing: 0.32em; text-transform: lowercase; color: var(--muted); margin: 0; }
  .rule { width: 48px; height: 1px; background: var(--line); margin: 10px 0 6px; }
  a.btn { display: inline-block; padding: 12px 26px; border: 1px solid var(--ink); border-radius: 999px;
          color: var(--ink); text-decoration: none; font-size: 14px; letter-spacing: 0.08em;
          transition: background .2s, color .2s; }
  a.btn:hover, a.btn:focus-visible { background: var(--ink); color: var(--ground); outline: none; }
  footer { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0;
           text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>batu partners</h1>
  <p class="tag">organic intelligence</p>
  <div class="rule" aria-hidden="true"></div>
  <a class="btn" href="mailto:alvaro@batupartners.com?subject=Hello%20from%20batupartners.com">contact</a>
</main>
<footer>alvaro@batupartners.com</footer>
</body>
</html>
